<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Emotion Analytics</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body {
      background: #07070F;
      color: white;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <h2>Emotion Timeline</h2>
  <svg width="800" height="300"></svg>

 <script>
  const svg = d3.select("svg");
  const data = [];

  function addEmotion(confidence) {
    data.push(confidence * 100);
    if (data.length > 50) data.shift();

    svg.selectAll("*").remove();

    svg.selectAll("rect")
      .data(data)
      .enter()
      .append("rect")
      .attr("x", (d, i) => i * 15)
      .attr("y", d => 300 - d * 2)
      .attr("width", 10)
      .attr("height", d => d * 2)
      .attr("fill", "#00ffcc");
  }

  const socket = new WebSocket("ws://127.0.0.1:8000/ws");

  socket.onmessage = (event) => {
    const msg = JSON.parse(event.data);

    if (msg.confidence !== undefined) {
      addEmotion(msg.confidence);
    }
  };
</script>
</body>
</html>
